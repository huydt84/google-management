services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gm
      POSTGRES_PASSWORD: gm
      POSTGRES_DB: gm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gm -d gm"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  gm-pgdata:
