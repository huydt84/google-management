[package]
name = "gm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Google Management: personal Gmail triage, local LLM summaries, Telegram notifications"

[[bin]]
name = "gm"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
askama = "0.14"
async-trait = "0.1"
axum = { version = "0.8", features = ["form", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
encoding_rs = "0.8"
fluent-templates = "0.13"
hmac = "0.12"
html-escape = "0.2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "json"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unic-langid = "0.9"
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
