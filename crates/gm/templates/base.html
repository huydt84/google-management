<!doctype html>
<html lang="{{ tr.code }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ tr.get("app-title") }}</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --fg:#1d1d1b; --muted:#6b6b66; --line:#e4e4df;
          --accent:#2457d6; --ok:#1f8a4c; --warn:#b26b00; --bad:#c0362c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --card:#1e1e1c; --fg:#ecece8; --muted:#9a9a93; --line:#2f2f2c;
            --accent:#7aa2ff; --ok:#4cc488; --warn:#e0a84a; --bad:#ef6f62; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px;
           flex-wrap:wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  a { color: var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:16px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:16px; }
  .muted { color: var(--muted); }
  .btn { display:inline-block; border:1px solid var(--line); background:var(--card);
         color:var(--fg); padding:6px 12px; border-radius:8px; font:inherit; cursor:pointer;
         text-decoration:none; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  form { display:inline; }
  .input { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line);
           border-radius:8px; padding:6px 10px; width:100%; max-width:320px; margin-top:4px; }
  dl { display:grid; grid-template-columns: max-content 1fr; gap:4px 12px; margin:0; }
  dt { color: var(--muted); }
  dd { margin:0; overflow-wrap:anywhere; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color: var(--muted); font-weight: 500; }
  .pill { font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid var(--line);
          white-space:nowrap; }
  .s-notified,.s-done,.ok { color: var(--ok); } .s-dead,.bad { color: var(--bad); }
  .s-triaged,.s-ready,.s-running,.s-pending,.warn { color: var(--warn); }
  .s-ignored,.s-digest,.s-gone,.s-empty,.s-classify { color: var(--muted); } .s-sent { color: var(--ok); } .s-building { color: var(--warn); }
</style>
</head>
<body><main>{% block body %}{% endblock %}</main></body>
</html>
