# Sampling per model (GM_LLM_PROFILE).
# temperature applies to the first attempt. thinking_temperature can override it for reasoning.
# top_p defaults to the runtime's setting when omitted. Retries use temperature 0.
models:
  prism-ml/Bonsai-27B-mlx-1bit:
    temperature: 0.7
    top_p: 0.95
  Bonsai-27B-mlx-1bit-direct:
    temperature: 0.7
    top_p: 0.95
  mlx-community/Qwen3-8B-4bit:
    temperature: 0.2
    thinking_temperature: 0.6
