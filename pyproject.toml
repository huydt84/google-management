[project]
name = "google-management"
version = "0.1.0"
description = "Personal Google event hub: ingest Google events, triage them, and notify via a local LLM."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "authlib>=1.3",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "cryptography>=43",
    "google-api-python-client>=2.150",
    "google-auth>=2.36",
    "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
pubsub = ["google-cloud-pubsub>=2.26"]

[project.scripts]
gm = "gm.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
